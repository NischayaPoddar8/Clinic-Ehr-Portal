spring.application.name=clinic-ehr
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic_ehr?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Admin account seeded at startup. No default password is stored in source control:
# set ADMIN_EMAIL and ADMIN_PASSWORD (min 8 chars) in the environment; if either is empty, nothing is seeded.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:System Administrator}

logging.level.com.clinic.ehr=INFO
logging.file.name=logs/clinic-ehr.log
