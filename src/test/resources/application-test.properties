# Repository / integration tests (mvn test -Pmysql-tests). Requires a running MySQL.
# Connection (override with environment variables):
#   DB_TEST_URL      default jdbc:mysql://localhost:3306/clinic_ehr_test (schema is created if missing)
#   DB_TEST_USER     default: DB_USER, else root
#   DB_TEST_PASSWORD default: DB_PASSWORD, else empty
spring.datasource.url=${DB_TEST_URL:jdbc:mysql://localhost:3306/clinic_ehr_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_TEST_USER:${DB_USER:root}}
spring.datasource.password=${DB_TEST_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=create-drop
logging.file.name=target/test.log

# Admin seeded for integration tests only
app.admin.email=admin@test.local
app.admin.password=Admin12345
app.admin.name=Test Admin
